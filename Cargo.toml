[workspace]
resolver = "3"
members = [
    "crates/easypdf",
    "crates/easypdf-core",
    "crates/easypdf-derive",
    "crates/easypdf-layout",
    "crates/easypdf-reader",
    "crates/easypdf-writer",
    "crates/easypdf-manipulate",
    "crates/easypdf-template",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easypdf-rust"
readme = "README.md"

[workspace.dependencies]
# --- Core foundations ---
thiserror = "2.0.18"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# --- PDF engines ---
lopdf = { version = "0.44.0", features = ["nom_parser"] }
printpdf = { version = "0.12.4", default-features = false, features = ["png", "html"] }
# justpdf = "0.1"  # Future alternative reader

# --- Image handling ---
image = { version = "0.25.9", default-features = false }

# --- Proc-macro ---
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"

# --- Testing ---
tempfile = "3.27.0"
trybuild = "1.0.116"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
