name: Lockfile refresh (temporary)
on:
  push:
    branches: [fix/clippy-rgba-chunks]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Update vulnerable transitive dependencies
        run: |
          cargo update -p quinn-proto --precise 0.11.19
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-roots --precise 1.0.11
      - name: Show exact lockfile change
        run: git diff -- Cargo.lock
