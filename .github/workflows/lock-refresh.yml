name: Lockfile refresh (temporary)
on:
  push:
    branches: [fix/clippy-rgba-chunks]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Update insecure and yanked dependencies
        run: |
          cargo update -p tokio --precise 1.53.3
          cargo update -p chacha20
      - name: Show exact lockfile change
        run: git diff -- Cargo.lock
