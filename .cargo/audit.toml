[advisories]
# RUSTSEC-2023-0071: rsa 0.9.x Marvin Attack (potential key recovery through timing sidechannels)
#
# Reason for ignoring:
#   rsa 0.9.10 is ONLY a dev-dependency in:
#     - crates/easypdf-core/Cargo.toml  [dev-dependencies]
#     - easypdf-test/Cargo.toml         [dev-dependencies]
#   Usage: test RSA key generation only (ring 0.17 has no keygen API).
#   Production signing/verification uses ring 0.17 (constant-time RSA).
#   Production path has ZERO dependency on rsa.
#
# When to re-evaluate:
#   - ring gains a keygen API -> remove rsa dev-dep entirely
#   - Or: switch test certificates to pre-generated .pem fixtures (no runtime keygen)
#
# See: https://rustsec.org/advisories/RUSTSEC-2023-0071
ignore = [
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0258: h2 0.3.27 unbounded empty DATA frames (low severity).
    # h2 0.3 series is EOL; fix landed only in 0.4.16+ (major bump).
    # Chain: rig-core 0.8 -> reqwest 0.11 -> hyper 0.14 -> h2 =0.3.x.
    # reqwest 0.12 (h2 0.4) requires rig-core upgrade; not possible in-tree.
    # Re-evaluate when rig-core moves to reqwest 0.12.
    "RUSTSEC-2026-0258",
]
